# BIRD 2.17.5 standalone test configuration
# Debian 192.168.11.13, MikroTik 192.168.11.1
# Do NOT add a kernel protocol for ru_restricted_table.
# Local AS 64002 / remote AS 64018 are based on the prior lab design.

log syslog all;
router id 192.168.11.13;

ipv4 table ru_restricted_table;

protocol device ru_device {}

# Approved static prefixes must be installed here by the operator.
# For initial tests, the previously reviewed candidate can be used:
include "/tmp/ru-restricted-review/candidate.bird.conf";

filter ru_export {
    if (source = RTS_STATIC) && (proto = "ru_restricted_static") then accept;
    reject;
}

protocol bgp ru_to_mikrotik {
    local 192.168.11.13 as 64002;
    neighbor 192.168.11.1 as 64018;
    ipv4 {
        table ru_restricted_table;
        import none;
        export filter ru_export;
    };
}

# No protocol kernel is configured; no generated blackhole route is installed
# in the Linux forwarding table. MikroTik must set/resolve the intended
# IPsec next hop on its BGP import side, rather than forward to this Debian.
